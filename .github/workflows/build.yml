name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Устанавливаем Gradle нужной версии без необходимости наличия gradlew в репозитории
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Собираем мод через установленный Gradle
      - name: Build Mod with Gradle
        run: gradle build --no-daemon

      # Сохраняем собранный .jar файл в артефакты запуска
      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearl-indicator-jar
          path: build/libs/*.jar

      # Если был пуш тега (например v1.0.0), создаем релиз с .jar файлом
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
