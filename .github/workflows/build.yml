name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Устанавливаем Gradle версии 8.11.1, совместимой с Fabric Loom 1.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Сборка мода
      - name: Build Mod with Gradle
        run: gradle build --no-daemon

      # Сохранение скомпилированного .jar в артефакты
      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearl-indicator-jar
          path: build/libs/*.jar

      # Публикация релиза при пуше тега (например, v1.0.0)
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
